[project]
name = "semantic-product-search"
version = "0.1.0"
description = "Find fashion products by description or reference photo with text embeddings, CLIP, and FAISS."
readme = "README.md"
license = "MIT"
authors = [{ name = "Taiwu Chen" }]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.8,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pillow>=10,<13",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.49,<2",
]

[project.optional-dependencies]
image = [
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
]

[project.urls]
Repository = "https://github.com/taiwuchen/semantic-product-search"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["product_search"]

# CPU-only PyTorch wheels on Linux; the app runs inference on CPU and CUDA wheels add gigabytes.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
